name: filestash

services:
  app:
    image: ${FILESTASH_IMAGE:?set FILESTASH_IMAGE to an immutable image digest}
    restart: unless-stopped
    environment:
      APPLICATION_URL: ${APPLICATION_URL:?set APPLICATION_URL to the public HTTPS URL}
      CANARY: "false"
      FILESTASH_ENV: production
      CONFIG_ENCRYPT: "true"
      CONFIG_SECRET_FILE: /run/secrets/config_secret
      OFFICE_URL: http://wopi_server:9980
      OFFICE_FILESTASH_URL: http://app:8334
      OFFICE_REWRITE_URL: ${APPLICATION_URL:?set APPLICATION_URL}/office
    ports:
      - "${FILESTASH_BIND_ADDRESS:-127.0.0.1}:8334:8334"
    volumes:
      - filestash_state:/app/data/state
    secrets:
      - setup_token
      - config_secret
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        export FILESTASH_SETUP_TOKEN="$$(cat /run/secrets/setup_token)";
        exec /app/filestash
    tmpfs:
      - /app/data/state/log:size=64m,mode=0700,uid=10001,gid=10001
      - /app/data/cache:size=256m,mode=0700,uid=10001,gid=10001
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8334/healthz]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      wopi_server:
        condition: service_healthy
    networks: [edge, office]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  wopi_server:
    image: collabora/code:24.04.10.2.1@sha256:3ee501932bda6c85f4ef116d696cf4cce92387491c764ceb9684da57913b605a
    restart: unless-stopped
    user: "1000:1000"
    environment:
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:logging.level=warning
        --o:security.capabilities=false
      aliasgroup1: ${COLLABORA_WOPI_ORIGIN:-https://filestash\.example\.com:443}
    expose:
      - "9980"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://127.0.0.1:9980/hosting/discovery >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks: [office]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge: {}
  office:
    internal: true

volumes:
  filestash_state: {}

secrets:
  setup_token:
    file: ${FILESTASH_SETUP_TOKEN_FILE:-./secrets/setup-token}
  config_secret:
    file: ${FILESTASH_CONFIG_SECRET_FILE:-./secrets/config-secret}
